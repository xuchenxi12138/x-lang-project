# xboot demo — 用户服务
#
# 环境变量可覆盖任意键（前缀 XBOOT_，点换下划线）：
#   XBOOT_SERVER_PORT=9090、XBOOT_DB_PASSWORD=secret

server.port=8080

# 处理 N 个请求后自动退出（0 = 一直运行）。E2E 测试用。
xboot.stop-after-requests=0

# 访问日志（stdout 打印每个请求）。
xboot.access-log=true

# ---- 数据源（有 @Mapper Bean 时才真正连接）----
db.driver=mysql
db.url=mysql://127.0.0.1:3306/xboot_demo
db.username=root
db.password=123456
