# blog 应用配置
#
# ── 格式：properties（key=value）───────────────
#
# 用 properties 而不是 yaml/json，理由见 stdlib/service/config.xle
# 的文件头：配置是「人写的」，格式越简单越不容易出错。
#
# ── 值的转义规则 ────────────────────────────
#
# 没有转义。写什么就是什么。
# 所以 Windows 路径可以直接写：path=C:\data\blog
# 不需要写成 path=C:\\data\\blog（那会得到双反斜杠）。

# ── HTTP ────────────────────────────────────
server.bind = 0.0.0.0
# 0 = 让系统分配随机端口。开发时用固定端口更方便。
server.port = 8080

# 单请求超时（毫秒）。
# 太小会让正常请求都超时，太大会让断线的连接占住服务（单线程模型）。
server.timeoutMs = 15000

# 请求体上限（字节）。8 MiB。
server.maxBodyBytes = 8388608

# ── 业务 ────────────────────────────────────
post.titleMaxLen = 200
post.listDefaultLimit = 20
# 注意：listDefaultLimit 不能大于 listMaxLimit，
# 否则「不传 limit」的请求会拿到超过上限的条数（启动时会校验）。
post.listMaxLimit = 100

# ── 功能开关 ─────────────────────────────────
feature.accessLog = true
feature.healthEndpoint = true
feature.cors = true

# ── CORS ────────────────────────────────────
# "*" 表示允许任意来源。
# 生产环境应该写具体域名：cors.allowOrigin = https://blog.example.com
cors.allowOrigin = *